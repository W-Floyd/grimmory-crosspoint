<div class="od-title-text">
  <span class="od-title-line">
    @if (bookId() !== null) {
      <a class="od-title in-library" [routerLink]="['/book', bookId()]"
        pTooltip="In your library — open it" tooltipPosition="top">
        <i class="pi pi-check-circle"></i>{{ title() }}
      </a>
    } @else {
      <span class="od-title">{{ title() }}</span>
    }
    @if (libbyUrl()) {
      <a [href]="libbyUrl()" target="_blank" rel="noopener noreferrer" class="od-libby"
        pTooltip="Open in Libby" tooltipPosition="top">
        <i class="pi pi-external-link"></i>
      </a>
    }
  </span>
  @if (subtitle()) {
    <small class="od-subtitle">{{ subtitle() }}</small>
  }
</div>
