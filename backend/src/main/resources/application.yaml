app:
  path-config: ${APP_PATH_CONFIG:/app/data}
  bookdrop-folder: ${APP_BOOKDROP_FOLDER:/bookdrop}
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}

   # OverDrive/Libby integration settings.
   # Enable by configuring the properties below. The chip token lifecycle is managed
   # in-memory; persist the token via the /api/overdrive/setup-code endpoint with a
   # Libby 8-digit setup code.
  overdrive:
    enabled: ${OVERDRIVE_ENABLED:false}
    sentry-base-url: ${OVERDRIVE_SENTRY_BASE_URL:https://sentry.libbyapp.com}
    client-id: ${OVERDRIVE_CLIENT_ID:dewey}
    # Base64 16/24/32-byte key (e.g. `openssl rand -base64 32`) enabling encrypted storage of card
    # number + PIN, for silent re-link and audiobook downloads. Empty = credential storage disabled.
    credential-key: ${OVERDRIVE_CREDENTIAL_KEY:}

  # ACSM handler — operator-supplied external tool that takes an OverDrive ACSM and procures the
  # book file (fulfilling/downloading, and any DRM handling, entirely within the tool). Grimmory
  # passes only the ACSM and an output path; it holds no keys or accounts of its own.
  # The tool must write the resulting book file to the {output} path.
  acsm:
    enabled: ${ACSM_ENABLED:false}
    tool-path: ${ACSM_TOOL_PATH:}
    tool-args: ${ACSM_TOOL_ARGS:--acsm {acsm} --output {output}}
    timeout-seconds: ${ACSM_TIMEOUT_SECONDS:120}

  # External audiobook handler for OverDrive audiobook loans. Grimmory writes a JSON manifest carrying
  # the card's number + PIN (decrypted from its encrypted store) + loan ids to {input}; the tool
  # authenticates itself (its own chip + app-emulating UA, kept separate from Grimmory's web chip),
  # fulfils, downloads and assembles the audiobook, and writes a single file into the {output} directory
  # (Grimmory imports it as an audiobook, taking the file type from the extension). The tool owns all
  # auth + fulfillment + network work. Requires the card to be linked by number + PIN with
  # OVERDRIVE_CREDENTIAL_KEY set (so its credentials are stored).
  audiobook:
    enabled: ${AUDIOBOOK_ENABLED:false}
    tool-path: ${AUDIOBOOK_TOOL_PATH:}
    tool-args: ${AUDIOBOOK_TOOL_ARGS:--manifest {input} --out-dir {output}}
    timeout-seconds: ${AUDIOBOOK_TIMEOUT_SECONDS:1800}

  cors:
    # Comma-separated list of allowed CORS origins.
    # Leave empty (default) to allow same-origin requests only.
    # Example: ALLOWED_ORIGINS=https://app.example.com,https://mobile.example.com
    allowed-origins: ${ALLOWED_ORIGINS:*}

  remote-auth:
    enabled: ${REMOTE_AUTH_ENABLED:false}
    create-new-users: ${REMOTE_AUTH_CREATE_NEW_USERS:true}
    header-name: ${REMOTE_AUTH_HEADER_NAME:Remote-Name}
    header-user: ${REMOTE_AUTH_HEADER_USER:Remote-User}
    header-email: ${REMOTE_AUTH_HEADER_EMAIL:Remote-Email}
    header-groups: ${REMOTE_AUTH_HEADER_GROUPS:Remote-Groups}
    admin-group: ${REMOTE_AUTH_ADMIN_GROUP}
    groups-delimiter: ${REMOTE_AUTH_GROUPS_DELIMITER:\\s+}
  force-disable-oidc: ${FORCE_DISABLE_OIDC:false}
  disk-type: ${DISK_TYPE:LOCAL}

  # OPDS device-optimization presets. Clients request an optimized file with
  # ?preset=<id> on catalog/download/cover URLs. Add a new device here (no recompile):
  # pick a stable, brand-qualified id (used in URLs, the on-disk cache path, and stored
  # per-user defaults, so do not change it once released) and set brand + model for the
  # display name (brand = device manufacturer).
  #
  # Conventions:
  #   - Dimensions are portrait: max-width = short edge, max-height = long edge.
  #   - grayscale defaults to true; color-panel devices (E Ink Kaleido/Gallery) set
  #     grayscale: false and size to the full B&W pixel resolution.
  #   - jpeg-quality defaults to 85, auto-crop to false.
  opds:
    max-source-file-size-mb: ${OPDS_OPTIMIZE_MAX_SOURCE_MB:100}
    device-presets:
      # --- Xteink (dimensions mirror the third-party Crosspoint firmware's DEVICE_PROFILES) ---
      xteink-x4:
        brand: "Xteink"
        model: "X4"
        max-width: 480
        max-height: 800
        jpeg-quality: 85
        grayscale: true
        auto-crop: false
        overlap-percent: 5
        handedness: right
      xteink-x3:
        brand: "Xteink"
        model: "X3"
        max-width: 528
        max-height: 792
        jpeg-quality: 85
        grayscale: true
        auto-crop: false
        overlap-percent: 5
        handedness: right
      # S4 runs Android 11 (sideloadable readers), so optimization is optional; kept for parity.
      xteink-s4:
        brand: "Xteink"
        model: "S4"
        max-width: 480
        max-height: 800
        grayscale: true

      # --- Onyx Boox (Android; native NeoReader or any OPDS app) ---
