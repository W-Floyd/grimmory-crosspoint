spring:
  flyway:
    # This is a fork, so migrations arrive from two directions. Fork-local migrations live in a
    # reserved high range (V900+) that upstream will never reach, which keeps their versions from
    # colliding — but it also means an upstream migration (V147, V148, ...) can show up *after* a
    # database has already applied fork migrations with higher numbers. Flyway rejects that by
    # default; allowing out-of-order is what lets upstream's migrations land on a fork database
    # without renumbering every one of them on merge. Checksums of already-applied migrations are
    # still validated.
    out-of-order: true

logging:
  level:
    # jaudiotagger logs "Ignoring Duplicate Frame:CHAP" for every chapter of a (correctly) chaptered
    # audiobook — CHAP is a repeatable ID3 frame it doesn't fully support, but the file is valid.
    # Left at the default level; set JAUDIOTAGGER_LOG_LEVEL=ERROR to silence that (and other) noise.
    org.jaudiotagger: ${JAUDIOTAGGER_LOG_LEVEL:INFO}
