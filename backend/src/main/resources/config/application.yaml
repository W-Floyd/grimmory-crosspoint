        model: "X4"
        max-width: 480
        max-height: 800
        jpeg-quality: 85
        grayscale: true
        auto-crop: false
        overlap-percent: 5
        handedness: right
      xteink-x3:
        brand: "Xteink"
        model: "X3"
        max-width: 528
        max-height: 792
        jpeg-quality: 85
        grayscale: true
        auto-crop: false
        overlap-percent: 5
        handedness: right
      # S4 runs Android 11 (sideloadable readers), so optimization is optional; kept for parity.
      xteink-s4:
        brand: "Xteink"
        model: "S4"
        max-width: 480
        max-height: 800
        grayscale: true

