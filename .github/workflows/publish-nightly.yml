name: Nightly - Build and Publish

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip the test suite (manual runs only)'
        required: false
        type: boolean
        default: false

jobs:
  resolve_ref:
    name: Resolve Nightly Ref
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read

    outputs:
      base_tag: ${{ steps.resolve.outputs.base_tag }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      from_ref: ${{ steps.resolve.outputs.from_ref }}
      nightly_tag: ${{ steps.resolve.outputs.nightly_tag }}
      should_build: ${{ steps.gate.outputs.should_build }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Record Resolved Commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu

          git fetch origin main --tags --force
          short_sha="$(git rev-parse --short HEAD)"
          build_date="$(date -u +%Y%m%d)"
          nightly_tag="nightly-${build_date}-${short_sha}"
          base_tag="$(git describe --tags --abbrev=0 --match 'v*' origin/main)"
          from_ref="$base_tag"

          echo "base_tag=${base_tag}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "from_ref=${from_ref}" >> "$GITHUB_OUTPUT"
          echo "nightly_tag=${nightly_tag}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Determine Whether A New Build Is Needed
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ steps.resolve.outputs.commit_sha }}
        run: |
          set -eu

          # Manual runs always build, regardless of commit history.
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: building unconditionally."
            exit 0
          fi

          # GHCR requires a lowercase path, but owner/repo names may contain uppercase.
          image_base="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          # The published image labels org.opencontainers.image.revision with the
          # commit it was built from (see Dockerfile APP_REVISION). Compare it to
          # the current tip so we only rebuild when develop has actually advanced.
          last_rev="$(docker buildx imagetools inspect "${image_base}:nightly" \
            --format '{{ range $k, $v := .Image }}{{ index $v.Config.Labels "org.opencontainers.image.revision" }}{{ "\n" }}{{ end }}' \
            2>/dev/null | grep -m1 . || true)"

          if [ -z "${last_rev}" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "No existing nightly image (or revision label) found: building."
          elif [ "${last_rev}" = "${HEAD_SHA}" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Tip ${HEAD_SHA} already published as nightly: skipping build."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "New commits since last nightly (${last_rev} -> ${HEAD_SHA}): building."
          fi

  build-and-push:
    name: Build and Push Nightly Image
    needs: [resolve_ref, test-suite]
    # always() so a *skipped* test-suite (skip_tests=true) still builds, while a real
    # failure/cancellation still blocks the build.
    if: ${{ always() && needs.resolve_ref.outputs.should_build == 'true' && needs.test-suite.result != 'failure' && needs.test-suite.result != 'cancelled' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.record.outputs.image_tag }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ needs.resolve_ref.outputs.commit_sha }}

      - name: Record Nightly Build Metadata
        id: record
        env:
          NIGHTLY_TAG: ${{ needs.resolve_ref.outputs.nightly_tag }}
        run: |
          echo "image_tag=${NIGHTLY_TAG}" >> "$GITHUB_OUTPUT"
          echo "nightly_tag=${NIGHTLY_TAG}" >> "$GITHUB_ENV"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Nightly tag: ${NIGHTLY_TAG}"

          # GHCR requires a lowercase path, but owner/repo names may contain uppercase.
          echo "image_base=ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set Up QEMU for Multi-Arch Builds
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          cache-image: false

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Authenticate to Docker Hub
        if: ${{ vars.DOCKERHUB_REGISTRY != '' }}
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ vars.DOCKERHUB_REGISTRY }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=nightly
            type=raw,value=${{ env.nightly_tag }}

      - name: Build and push Stable image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            APP_VERSION=${{ env.nightly_tag }}
            APP_REVISION=${{ env.commit_sha }}
          cache-from: |
            type=gha,scope=image-shared
            type=registry,ref=${{ env.image_base }}:buildcache
          cache-to: |
            type=gha,scope=image-shared,mode=max
            type=registry,ref=${{ env.image_base }}:buildcache,mode=max

  export-openapi:
    name: Export Nightly OpenAPI Artifact
    needs: [resolve_ref]
    if: ${{ needs.resolve_ref.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ needs.resolve_ref.outputs.commit_sha }}

      - name: Export OpenAPI JSON
        uses: ./.github/actions/export-openapi
        with:
          checkout_ref: ${{ needs.resolve_ref.outputs.commit_sha }}
          app_version: ${{ needs.resolve_ref.outputs.nightly_tag }}

      - name: Upload Nightly OpenAPI Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-${{ needs.resolve_ref.outputs.nightly_tag }}
          path: backend/build/openapi/grimmory-openapi.json
          retention-days: 30

  test-suite:
    name: Test Suite
    needs: [resolve_ref]
    if: ${{ needs.resolve_ref.outputs.should_build == 'true' && !inputs.skip_tests }}
    uses: ./.github/workflows/test-suite.yml
    permissions:
      contents: read
      checks: write
    with:
      checkout_ref: ${{ needs.resolve_ref.outputs.commit_sha }}
      save_gradle_cache: true
