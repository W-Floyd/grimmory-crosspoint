services:
  # Upgrade path from Booklore:
  # Keep your existing service name, container_name, database names/users, ports,
  # and mounted volumes. Replace only the image line(s) with Grimmory tags.
  grimmory:
    # Stable release example:
    image: grimmory/grimmory:v0.38.2
    # Convenience tag:
    # image: grimmory/grimmory:latest
    # Or the GHCR image:
    # image: ghcr.io/grimmory-tools/grimmory:v0.38.2
    # The image already embeds its own release version metadata.
    container_name: grimmory
    environment:
      - USER_ID=1000
      - GROUP_ID=1000
      - TZ=Etc/UTC
      - DATABASE_URL=jdbc:mariadb://mariadb:3306/grimmory
      - DATABASE_USERNAME=grimmory
      - DATABASE_PASSWORD=your_secure_password
      - SWAGGER_ENABLED=false
      - FORCE_DISABLE_OIDC=false
      # ALLOWED_ORIGINS=
      #
      # OverDrive / Libby integration (borrow, holds, sync, catalog search). Off by default;
      # set OVERDRIVE_ENABLED=true to expose the endpoints, then configure your library key
      # under Settings → OverDrive/Libby and link a Libby account with an 8-digit setup code.
      # - OVERDRIVE_ENABLED=true
      # - OVERDRIVE_CLIENT_ID=dewey                     # rarely needs changing
      # - OVERDRIVE_SENTRY_BASE_URL=https://sentry.libbyapp.com
      # Optional: enable encrypted storage of card number + PIN (for card+PIN linking) so an expired
      # token can be re-linked automatically. base64-encoded 16/24/32 bytes, e.g. `openssl rand -base64 32`.
      # Unset = token-only (re-link manually on expiry); no plaintext credentials are ever stored.
      # - OVERDRIVE_CREDENTIAL_KEY=<base64-32-bytes>
      #
      # Most Libby titles offer a DRM-free "open" EPUB and import with no extra setup.
      # For titles that only offer the Adobe/ACSM format, Grimmory can hand the ACSM to an
      # operator-supplied external tool that procures the book file. Grimmory ships no such
      # tool and holds no keys/accounts — you supply and mount the tool (below), and ensure
      # you have the right to do so. Leave ACSM_ENABLED unset/false to keep it off.
      # - ACSM_ENABLED=true
      # - ACSM_TOOL_PATH=/opt/acsm/acsm-tool           # your tool or wrapper script (must be executable in the container)
      # - ACSM_TOOL_ARGS=-f {acsm} -o {output}
      # - ACSM_TIMEOUT_SECONDS=120
      #
      # Audiobook titles work the same way, via a separate operator-supplied tool. Grimmory writes a
      # JSON manifest (the card's chip token + loan/card/format ids) to {input}; your tool fulfils,
      # downloads and assembles the audiobook itself and writes a single file into the {output} dir,
      # which Grimmory imports as an audiobook. Grimmory ships no such tool. Leave AUDIOBOOK_ENABLED
      # unset/false to keep it off.
      # - AUDIOBOOK_ENABLED=true
      # - AUDIOBOOK_TOOL_PATH=/opt/audiobook/od-audiobook   # your tool or wrapper script (executable in the container)
      # - AUDIOBOOK_TOOL_ARGS=--manifest {input} --out-dir {output}
      # - AUDIOBOOK_TIMEOUT_SECONDS=1800               # audiobooks are large; default 30 min
      # Override JVM memory defaults (the image ships sensible defaults for ~512 MB heap).
      # Uncomment and adjust if you want a tighter or looser cap:
      # JAVA_TOOL_OPTIONS=-Xmx256m
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "6060:6060"
    volumes:
      - ./data:/app/data
      - ./books:/books
      - ./bookdrop:/bookdrop
      # Operator-supplied ACSM handler tool for OverDrive borrow & import (see the ACSM_* env
      # vars above). Put a self-contained tool + its Adobe account dir here. Note the image is
      # Alpine/musl — a native binary must be musl-compatible or statically linked, and there
      # is no python runtime in the image, so mount a self-contained executable.
      # Mount READ-WRITE (not :ro): the account must be a fully ACTIVATED ADE account, and the
      # tool updates activation.xml at fulfill time (it caches each operator's license-service
      # certificate there and reads it back to build rights.xml). Ensure ./acsm — especially
      # ./acsm/account — is writable by and owned by the container user (USER_ID:GROUP_ID, 1000).
      # - ./acsm:/opt/acsm
      # Operator-supplied audiobook handler tool (see the AUDIOBOOK_* env vars above). Same image
      # caveats as the ACSM tool: Alpine/musl, no python runtime — mount a self-contained executable.
      # - ./audiobook:/opt/audiobook
    # Uncomment the block below if you need to override the defaults:
    #healthcheck:
    #  test: wget -q --spider http://localhost:6060/api/v1/healthcheck
    #  interval: 60s
    #  retries: 5
    #  start_period: 60s
    #  timeout: 10s
    #
    # Uncomment the block below if you want to disable healthchecks:
    #healthcheck:
    #  disable: true
    restart: unless-stopped

  mariadb:
    image: lscr.io/linuxserver/mariadb:11.4.8
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - MYSQL_ROOT_PASSWORD=super_secure_password
      - MYSQL_DATABASE=grimmory
      - MYSQL_USER=grimmory
      - MYSQL_PASSWORD=your_secure_password
    volumes:
      - ./config:/config
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mariadb-admin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 10
